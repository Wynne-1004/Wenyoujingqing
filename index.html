<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diary">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e6dcf7">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>🪻</title>
<style>
:root{--bg:#f6f1fb;--card:#fff;--ink:#3b2f4a;--sub:#8a7a9e;--acc:#9b7fd1;--line:#ece4f6;--soft:#efe7fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1626;--card:#262033;--ink:#efe8f8;--sub:#a496b8;--line:#3a3049;--soft:#322a42}}
:root[data-theme="dark"]{--bg:#1b1626;--card:#262033;--ink:#efe8f8;--sub:#a496b8;--line:#3a3049;--soft:#322a42}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;max-width:560px;margin:0 auto;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
html{-webkit-text-size-adjust:100%}
input,textarea{font-size:16px}
input[type=date],input[type=datetime-local]{display:block;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:40px}
body{overflow-x:clip;touch-action:manipulation}
button{cursor:pointer;border:0;background:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.top h1{font-size:16px;margin:0;color:var(--acc);letter-spacing:2px}
.sw{display:flex;background:var(--soft);border-radius:20px;padding:3px}
.sw button{padding:4px 14px;border-radius:17px;font-size:13px;color:var(--sub)}
.sw button.on{background:var(--acc);color:#fff}
.cover{height:190px;background-size:cover;background-position:center;position:relative;margin:0 0 44px}
.cover .nm{position:absolute;right:92px;bottom:8px;color:#fff;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.45);font-size:17px}
.cover .av{position:absolute;right:14px;bottom:-34px;width:68px;height:68px;border:3px solid var(--card);border-radius:14px;font-size:34px}
.av{width:42px;height:42px;border-radius:10px;background:var(--soft) center/cover;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.info{padding:0 16px 10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bio{color:var(--sub);font-size:13px;margin:0;flex:1}
.days{display:inline-block;background:var(--soft);color:var(--acc);border-radius:12px;padding:1px 10px;font-size:12px;margin-top:4px}
.btns{display:flex;gap:8px;padding:6px 16px 14px}
.btn{flex:1;padding:9px;border-radius:12px;background:var(--soft);color:var(--acc);font-size:14px}
.btn.p{background:var(--acc);color:#fff}
.post{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line);background:var(--card)}
.bd{flex:1;min-width:0}
.bd b{color:var(--acc);font-size:14px}
.bd p{margin:2px 0 6px;white-space:pre-wrap;word-break:break-word}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:330px;margin-bottom:6px}
.imgs.one{grid-template-columns:1fr;max-width:230px}
.imgs div{aspect-ratio:1;background:center/cover var(--soft);border-radius:6px}
.imgs.one div{aspect-ratio:auto;height:230px}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;align-items:center}
.meta span button{color:var(--acc);font-size:13px;margin-left:10px}
.cm{background:var(--soft);border-radius:8px;padding:6px 10px;margin-top:8px;font-size:13px}
.cm div{margin:2px 0}.cm i{font-style:normal;color:var(--acc);font-weight:600}
.cin{display:flex;gap:6px;margin-top:8px}
.cin input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:7px 12px;font-size:16px}
.cin button{color:var(--acc);font-size:13px}
.empty{text-align:center;color:var(--sub);padding:40px 20px;background:var(--card)}
.tg{background:var(--soft);color:var(--acc);border-radius:10px;padding:0 8px;margin-right:6px}
#ub{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;border-radius:14px;padding:12px;text-align:center;display:none;z-index:40}
.gs{background:var(--soft);color:var(--sub);border-radius:8px;padding:6px 10px;font-size:13px;margin-bottom:6px}.gs button{color:var(--acc);margin-left:8px}
#m2{position:fixed;inset:0;background:rgba(30,20,50,.45);display:none;align-items:flex-end;justify-content:center;z-index:25}
#m2.on{display:flex}
.tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto}
.tabs button{padding:5px 14px;border-radius:16px;background:var(--soft);color:var(--sub);font-size:13px;white-space:nowrap}
.tabs button.on{background:var(--acc);color:#fff}
.pane{padding:14px 16px;background:var(--card);border-top:1px solid var(--line)}
.pane label{display:block;font-size:12px;color:var(--sub);margin:12px 0 4px}
.pane input[type=text],.pane input[type=password],.pane input[type=date],.pane textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.pane textarea{min-height:90px}
.sub{color:var(--sub);font-size:13px;margin:0}
.big{background:linear-gradient(135deg,var(--soft),var(--bg));border-radius:14px;padding:22px 16px;text-align:center;font-size:16px;margin-bottom:10px}
.big small{display:block;color:var(--sub);font-size:12px;margin-top:8px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.li small{color:var(--sub);font-size:12px}
.li.d span{color:var(--sub);text-decoration:line-through}
.li button{color:var(--sub)}
.gi{width:100%;border-radius:12px;margin-top:12px}
#m{position:fixed;inset:0;background:rgba(30,20,50,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#m.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;color:var(--acc)}
.sheet label{display:block;font-size:12px;color:var(--sub);margin:12px 0 4px}
.sheet input[type=text],.sheet input[type=password],.sheet input[type=date],.sheet input[type=datetime-local],.sheet textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.sheet textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{padding:3px 11px;border-radius:14px;background:var(--soft);font-size:13px}
.chip.on{background:var(--acc);color:#fff}
.sw8{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.th{width:24px;height:24px;border-radius:50%}
.pv{width:54px;height:54px;border-radius:10px;background:var(--soft) center/cover;display:flex;align-items:center;justify-content:center;font-size:26px}
.fl{padding:6px 12px;border-radius:10px;background:var(--soft);color:var(--acc);font-size:13px}
#t{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#3b2f4a;color:#fff;padding:7px 16px;border-radius:18px;font-size:13px;display:none;z-index:30}
</style>
</head>
<body>
<div class="top"><span style="font-size:20px">🪻</span><div class="sw" id="sw"></div></div>
<div id="hd"></div>
<div class="tabs" id="tb"></div>
<div id="feed"></div>
<div id="m"><div class="sheet" id="sh"></div></div>
<div id="m2"><div class="sheet" id="sh2"></div></div>
<div id="t"></div>
<div id="ub" data-a="reload">✨ 有新版本啦，点这里刷新</div>
<input type="file" id="fi" accept="image/*" hidden>
<input type="file" id="fj" accept=".json" hidden>
<script>
var K='iris_diary_v1';
var GR={g1:'linear-gradient(135deg,#d9c8f5,#a98bdc)',g2:'linear-gradient(135deg,#efe3ff,#b7a0e8)',g3:'linear-gradient(135deg,#f3d9ee,#c5a8e6)',g4:'linear-gradient(135deg,#cfd8f7,#a89be0)',g5:'linear-gradient(135deg,#8d77c4,#4b3a7a)'};
var ACC=['#9b7fd1','#b08be0','#7f8fd8','#c27fbf','#7a5ec2'];
var MOODS=['🪻 想你','☁️ 发呆','🌙 晚安','🍓 开心','🌧️ 有点丧','✨ 小确幸','🍵 日常'];
function def(){return{cur:'me',tab:'feed',tags:[],hide:true,notes:[],wishes:[],days:[],api:{url:'',key:'',model:'',size:'1024x1024'},gprompt:'',acc:ACC[0],anniv:'',profiles:{me:{name:'我',bio:'今天也在想你。',avatar:'',cover:'g1',emoji:'🌙'},ta:{name:'Ta',bio:'浅紫色的鸢尾花 🪻',avatar:'',cover:'g2',emoji:'🪻'}},posts:[]}}
function load(){try{var r=localStorage.getItem(K);if(r)return Object.assign(def(),JSON.parse(r))}catch(e){}return def()}
var S=load(),D=null,pend=null;
S.posts.forEach(function(p){if(p.gen&&p.gen.s=='p')p.gen={s:'f',p:p.gen.p,e:'生成被中断了'}});
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('存储空间满了，请导出备份并删掉一些图片')}}
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(s){var t=$('#t');t.textContent=s;t.style.display='block';setTimeout(function(){t.style.display='none'},2200)}
function fmt(ts){var d=new Date(ts),p=function(n){return n<10?'0'+n:n};return d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes())}
function av(w,cls){var p=S.profiles[w];return '<div class="av '+(cls||'')+'"'+(p.avatar?' style="background-image:url(\''+p.avatar+'\')"':'')+'>'+(p.avatar?'':esc(p.emoji))+'</div>'}
function cv(c){return c&&c.indexOf('data:')==0?'url(\''+c+'\')':(GR[c]||GR.g1)}
function pic(file,max,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)}
function pick(max,cb){var f=$('#fi');f.value='';f.onchange=function(){if(f.files[0])pic(f.files[0],max,cb)};f.click()}
function render(){
 document.documentElement.style.setProperty('--acc',S.acc);
 var p=S.profiles[S.cur];
 $('#sw').innerHTML=['me','ta'].map(function(w){return '<button data-a="sw" data-w="'+w+'" class="'+(S.cur==w?'on':'')+'">'+esc(S.profiles[w].name)+'</button>'}).join('');
 var dy=S.anniv?Math.floor((Date.now()-new Date(S.anniv))/864e5)+1:0;
 $('#hd').innerHTML='<div class="cover" style="background-image:'+cv(p.cover)+'"><span class="nm">'+esc(p.name)+'</span>'+av(S.cur)+'</div><div class="info"><div><p class="bio">'+esc(p.bio)+'</p>'+(dy>0?'<span class="days">相遇的第 '+dy+' 天</span>':'')+'</div></div><div class="btns"><button class="btn" data-a="edit">装饰主页</button><button class="btn p" data-a="new">写一条</button></div>';
if(S.tab=='gen')S.tab='feed';tabs();$('#feed').innerHTML=view();
}
function post(o){
 var im=(o.imgs||[]).map(function(s){return '<div style="background-image:url(\''+s+'\')"></div>'}).join('');
 var ln=['me','ta'].filter(function(w){return o.likes&&o.likes[w]}).map(function(w){return esc(S.profiles[w].name)});
 var cm=(o.comments||[]).map(function(c){return '<div><i>'+esc(S.profiles[c.who].name)+'：</i>'+esc(c.text)+'</div>'}).join('');
 return '<div class="post">'+av(o.who)+'<div class="bd"><b>'+esc(S.profiles[o.who].name)+'</b><p>'+esc(o.text)+'</p>'+(im?'<div class="imgs'+(o.imgs.length==1?' one':'')+'">'+im+'</div>':'')+gst(o)+'<div class="meta"><span>'+(o.mood?'<span class="tg">'+esc(o.mood)+'</span>':'')+fmt(o.ts)+'</span><span><button data-a="like" data-id="'+o.id+'">'+(o.likes&&o.likes[S.cur]?'🪻 已赞':'🪻 赞')+'</button>'+(o.who==S.cur?'<button data-a="del" data-id="'+o.id+'">删除</button>':'')+'</span></div>'+((ln.length||cm)?'<div class="cm">'+(ln.length?'<div>🪻 '+ln.join('、')+'</div>':'')+cm+'</div>':'')+'<div class="cin"><input id="c'+o.id+'" placeholder="以「'+esc(S.profiles[S.cur].name)+'」的身份留言…"><button data-a="cmt" data-id="'+o.id+'">留言</button></div></div></div>';
}
function open(h){$('#sh').innerHTML=h;$('#m').classList.add('on')}
function close(){$('#m').classList.remove('on');D=null;pend=null}
function composer(){
 var n=new Date(),z=new Date(n-n.getTimezoneOffset()*6e4).toISOString().slice(0,16);
 pend={imgs:[]};
 open('<h3>以「'+esc(S.profiles[S.cur].name)+'」的身份记录</h3><textarea id="tx" placeholder="碎碎念、今天发生的事、一段回忆……"></textarea><label>心情标签（想写什么都行，也可以点下面的）</label><input type="text" id="mi" maxlength="12" placeholder="比如：想你、今天好累、小确幸"><div class="row" id="md" style="margin-top:8px">'+S.tags.concat(MOODS).map(function(m){return '<button class="chip" data-a="mood" data-m="'+esc(m)+'">'+esc(m)+'</button>'}).join('')+'</div><label>图片（最多 6 张）</label><div class="row" id="pv"></div>'+gui()+'<label>时间（写回忆可改成过去的日子）</label><input type="datetime-local" id="dt" value="'+z+'"><div class="btns" style="padding:16px 0 0"><button class="btn" data-a="close">取消</button><button class="btn p" data-a="pub">发布</button></div>');
 pvr();
}
function pvr(){$('#pv').innerHTML=pend.imgs.map(function(s,i){return '<div class="pv" style="background-image:url(\''+s+'\')" data-a="rmimg" data-i="'+i+'"></div>'}).join('')+(pend.imgs.length<6?'<button class="pv" data-a="addimg">＋</button>':'')}
function editor(){
 var p=S.profiles[S.cur];D={name:p.name,bio:p.bio,avatar:p.avatar,cover:p.cover,anniv:S.anniv,acc:S.acc};
 open('<h3>装饰「'+esc(p.name)+'」的主页</h3><label>昵称</label><input type="text" id="en" maxlength="16" value="'+esc(p.name)+'"><label>个性签名</label><input type="text" id="eb" maxlength="60" value="'+esc(p.bio)+'"><label>头像</label><div class="row"><div class="pv" id="eav"></div><button class="fl" data-a="pav">上传头像</button><button class="fl" data-a="rav">用表情代替</button></div><label>主页背景</label><div class="row" id="ecv"></div><div class="row" style="margin-top:8px"><button class="fl" data-a="pcv">上传背景图</button></div><label>相遇纪念日</label><input type="date" id="ea" value="'+esc(S.anniv)+'"><label>主题色</label><div class="row">'+ACC.map(function(c){return '<button class="th" style="background:'+c+'" data-a="acc" data-c="'+c+'"></button>'}).join('')+'</div><label>生图设置</label><div class="row"><button class="fl" data-a="gset">打开生图设置</button></div><label>应用更新</label><div class="row"><button class="fl" data-a="upd">🔄 检查并刷新到最新版</button></div><label>数据备份</label><div class="row"><button class="fl" data-a="exp">导出备份</button><button class="fl" data-a="imp">导入备份</button></div><div class="btns" style="padding:16px 0 0"><button class="btn" data-a="close">取消</button><button class="btn p" data-a="saveP">保存</button></div>');
 evr();
}
function evr(){
 var a=$('#eav');a.style.backgroundImage=D.avatar?'url(\''+D.avatar+'\')':'none';a.textContent=D.avatar?'':S.profiles[S.cur].emoji;
 $('#ecv').innerHTML=Object.keys(GR).map(function(g){return '<button class="sw8" style="background:'+GR[g]+(D.cover==g?';outline:2px solid var(--acc)':'')+'" data-a="pre" data-g="'+g+'"></button>'}).join('')+(D.cover.indexOf('data:')==0?'<div class="sw8" style="background:'+cv(D.cover)+' center/cover;outline:2px solid var(--acc)"></div>':'');
}
document.addEventListener('click',function(e){
 if(e.target.id=='m'){close();return}
 var t=e.target.closest('[data-a]');if(!t)return;
 var a=t.dataset.a,id=+t.dataset.id,p;
 if(a=='sw'){S.cur=t.dataset.w;save();render()}
 else if(a=='new')composer();
 else if(a=='edit')editor();
 else if(a=='close')close();
 else if(a=='mood'){$('#mi').value=t.dataset.m}
 else if(a=='addimg')pick(900,function(s){pend.imgs.push(s);pvr()});
 else if(a=='rmimg'){pend.imgs.splice(+t.dataset.i,1);pvr()}
 else if(a=='pub'){var tx=$('#tx').value.trim();var gpv=$('#gpm')&&pend.gen?$('#gpm').value.trim():'';if(!tx&&!pend.imgs.length&&!gpv){toast('写点什么吧');return}if(gpv&&!S.api.url){toast('先点「生图设置」填好 API 地址');return}
  var ts=new Date($('#dt').value).getTime()||Date.now();
  var mv=$('#mi').value.trim().slice(0,12);if(mv&&MOODS.indexOf(mv)<0&&S.tags.indexOf(mv)<0){S.tags.unshift(mv);S.tags=S.tags.slice(0,10)}var nid=Date.now();S.posts.push({id:nid,who:S.cur,text:tx,imgs:pend.imgs,mood:mv,ts:ts,likes:{},comments:[],gen:gpv?{s:'p',p:gpv}:null});save();close();render();if(gpv)runGen(nid)}
 else if(a=='like'){p=S.posts.filter(function(x){return x.id==id})[0];p.likes=p.likes||{};p.likes[S.cur]=!p.likes[S.cur];save();render()}
 else if(a=='cmt'){var v=$('#c'+id).value.trim();if(!v)return;p=S.posts.filter(function(x){return x.id==id})[0];p.comments=p.comments||[];p.comments.push({who:S.cur,text:v});save();render()}
 else if(a=='del'){if(confirm('确定删除这条记录吗？')){S.posts=S.posts.filter(function(x){return x.id!=id});save();render()}}
 else if(a=='pav')pick(300,function(s){D.avatar=s;evr()});
 else if(a=='rav'){D.avatar='';evr()}
 else if(a=='pcv')pick(1000,function(s){D.cover=s;evr()});
 else if(a=='pre'){D.cover=t.dataset.g;evr()}
 else if(a=='acc'){D.acc=t.dataset.c;document.documentElement.style.setProperty('--acc',D.acc)}
 else if(a=='saveP'){var q=S.profiles[S.cur];q.name=$('#en').value.trim()||q.name;q.bio=$('#eb').value;q.avatar=D.avatar;q.cover=D.cover;S.anniv=$('#ea').value;S.acc=D.acc;save();close();render()}
 else if(a=='exp'){var b=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='iris-diary-backup.json';l.click();toast('已导出')}
 else if(a=='imp'){var f=$('#fj');f.value='';f.onchange=function(){var r=new FileReader();r.onload=function(){try{S=Object.assign(def(),JSON.parse(r.result));save();close();render();toast('导入成功')}catch(x){toast('文件格式不对')}};r.readAsText(f.files[0])};f.click()}
});
var RN=Math.floor(Math.random()*1e6),G={img:''};
var TABS=[['feed','动态'],['note','小纸条'],['wish','心愿'],['day','纪念日']];
function tabs(){$('#tb').innerHTML=TABS.filter(function(t){return t[0]!='gen'||S.cur=='ta'}).map(function(t){return '<button data-a="tab" data-t="'+t[0]+'" class="'+(S.tab==t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')}
function nm(w){return esc(S.profiles[w].name)}
function dd(s){var a=new Date(s+'T00:00'),b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/864e5)}
function view(){var t=S.tab;return t=='note'?vNote():t=='wish'?vWish():t=='day'?vDay():vFeed()}
function vFeed(){var ps=S.posts.slice().sort(function(a,b){return b.ts-a.ts});return ps.length?ps.map(post).join(''):'<div class="empty">🪻<br>还没有记录，点「写一条」开始吧</div>'}
var ND=-1;
function vNote(){var n=S.notes,r=ND>=0&&n[ND]?n[ND]:null;
 return '<div class="pane"><div class="big">'+(r?'「'+esc(r.text)+'」<small>—— '+nm(r.who)+'</small>':(n.length?'盒子里有 '+n.length+' 张小纸条<small>点下面的按钮，抽一张看看</small>':'盒子是空的，先写一张吧'))+'</div><div class="row"><button class="btn p" data-a="roll" style="flex:1">'+(r?'再抽一张':'抽一张')+'</button>'+(r?'<button class="btn" data-a="deln" data-i="'+ND+'" style="flex:1">撕掉这张</button>':'')+'</div><label>以「'+nm(S.cur)+'」的身份写一张（想对Ta说的话 / Ta会对你说的话）</label><div class="cin"><input id="ni" placeholder="写下来，放进小纸条盒"><button data-a="addn">放进去</button></div>'+(S.hide?'<p class="sub" style="margin-top:12px">写好的纸条会被藏起来，只有抽到的时候才能看见。</p>':n.map(function(x,i){return '<div class="li"><span>'+esc(x.text)+' <small>—'+nm(x.who)+'</small></span><button data-a="deln" data-i="'+i+'">✕</button></div>'}).join(''))+'<div class="row" style="margin-top:12px"><button class="fl" data-a="thide">'+(S.hide?'显示所有纸条':'把纸条藏起来')+'</button></div></div>'}
function vWish(){return '<div class="pane"><label>以「'+nm(S.cur)+'」的身份添加想一起做的事（点一下可勾选完成）</label><div class="cin"><input id="wi" placeholder="比如：一起去看一次海"><button data-a="addw">添加</button></div>'+S.wishes.map(function(x,i){return '<div class="li'+(x.done?' d':'')+'"><span data-a="tw" data-i="'+i+'" style="flex:1">'+(x.done?'🪻 ':'○ ')+esc(x.text)+' <small>—'+nm(x.who)+'</small></span><button data-a="delw" data-i="'+i+'">✕</button></div>'}).join('')+'</div>'}
function nx(d){var a=d.split('-'),y=new Date().getFullYear(),b=new Date();b.setHours(0,0,0,0);var t=new Date(y,+a[1]-1,+a[2]);if(t<b)t=new Date(y+1,+a[1]-1,+a[2]);return{k:Math.round((t-b)/864e5),n:t.getFullYear()-(+a[0])}}
function dl(n,d,x,yr){var k,sm=d;if(yr){var r=nx(d);k=r.k;sm='每年 '+(+d.slice(5,7))+'月'+(+d.slice(8,10))+'日'+(r.n>0?' · 将满 '+r.n+' 年':'')}else k=dd(d);return '<div class="li"><span>'+esc(n)+' <small>'+sm+'</small></span><span><b style="color:var(--acc)">'+(k>0?'还有 '+k+' 天':k==0?'就是今天 🪻':'已经 '+(-k)+' 天')+'</b>'+(x||'')+'</span></div>'}
function vDay(){return '<div class="pane"><label>添加纪念日 / 倒数日</label><input type="text" id="dn" placeholder="名字，比如：第一次见面"><input type="date" id="dv" style="margin-top:6px"><label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)"><input type="checkbox" id="dy"> 每年重复（比如生日、周年）</label><button class="btn p" data-a="addd" style="width:100%;margin-top:8px">添加</button><div style="margin-top:8px">'+(S.anniv?dl('相遇',S.anniv):'')+S.days.map(function(x,i){return dl(x.name,x.date,'<button data-a="deld" data-i="'+i+'" style="margin-left:8px">✕</button>',x.yr)}).join('')+'</div></div>'}
function toData(src,max,cb){var im=new Image();im.crossOrigin='anonymous';im.onload=function(){try{var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))}catch(e){cb(src)}};im.onerror=function(){cb(src);toast('图片链接无法转存，之后可能失效')};im.src=src}
function gp_(id){return S.posts.filter(function(x){return x.id==id})[0]}
function gf(k,l,ph,ty){return '<label>'+l+'</label><input type="'+(ty||'text')+'" data-g="'+k+'" placeholder="'+ph+'" value="'+esc(S.api[k]||'')+'">'}
function gset(){$('#sh2').innerHTML='<h3>生图设置</h3><p class="sub">填你自己的生图接口（OpenAI 格式），只保存在这台设备里。</p>'+gf('url','API 地址（完整链接，需 https）','https://你的接口/v1/images/generations')+gf('key','API Key（可留空）','sk-...','password')+gf('model','模型名（可留空）','比如 dall-e-3')+gf('size','图片尺寸','1024x1024')+'<div class="btns" style="padding:16px 0 0"><button class="btn p" data-a="gclose">完成</button></div>';$('#m2').classList.add('on')}
function gui(){if(S.cur!='ta')return '';return '<label>AI 配图（可选）</label><div class="row"><button class="chip" id="gt" data-a="gtog">🎨 给这条配一张 AI 图</button><button class="fl" data-a="gset">⚙ 生图设置</button></div><div id="gb" style="display:none;margin-top:8px"><textarea id="gpm" placeholder="写下生图提示词，发布后会在后台生成，图片自动出现在这条动态里" style="min-height:70px"></textarea><div class="row" style="margin-top:6px">'+['浅紫色鸢尾花','水彩插画','柔和月光','情侣剪影','梦幻氛围'].map(function(q){return '<button class="chip" data-a="gq" data-q="'+q+'">'+q+'</button>'}).join('')+'</div></div>'}
function gst(o){return o.gen?'<div class="gs">'+(o.gen.s=='p'?'🎨 配图生成中，稍等一会儿…':'⚠️ 配图没生成出来：'+esc(o.gen.e||'未知原因')+'<button data-a="gretry" data-id="'+o.id+'">重试</button><button data-a="gdrop" data-id="'+o.id+'">不要了</button>')+'</div>':''}
function runGen(id){var o=gp_(id);if(!o||!o.gen)return;var a=S.api,pr=o.gen.p;o.gen={s:'p',p:pr};save();render();
 var h={'Content-Type':'application/json'};if(a.key)h.Authorization='Bearer '+a.key;
 var b={prompt:pr,n:1,size:a.size||'1024x1024'};if(a.model)b.model=a.model;
 function fail(e){var p=gp_(id);if(!p)return;var m=e&&e.message||'';if(m=='Failed to fetch'||m=='Load failed')m='连不上接口（请检查地址、https 或跨域设置）';p.gen={s:'f',p:pr,e:m};save();render()}
 fetch(a.url,{method:'POST',headers:h,body:JSON.stringify(b)}).then(function(x){return x.json()}).then(function(j){var d=j.data&&j.data[0];if(!d)throw new Error((j.error&&(j.error.message||j.error))||'返回格式不对');var src=d.b64_json?'data:image/png;base64,'+d.b64_json:d.url;toData(src,900,function(s){var p=gp_(id);if(!p)return;p.imgs=(p.imgs||[]).concat([s]);p.gen=null;save();render()})}).catch(fail)}
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.g){S.api[t.dataset.g]=t.value;save()}else if(t.id=='gp'){S.gprompt=t.value;save()}});
document.addEventListener('click',function(e){if(e.target.id=='m2'){$('#m2').classList.remove('on');return}var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a,i=+t.dataset.i,v;
 if(a=='tab'){S.tab=t.dataset.t;save();render()}
 else if(a=='roll'){var L=S.notes.length;if(L){var k=Math.floor(Math.random()*L);if(L>1)while(k==ND)k=Math.floor(Math.random()*L);ND=k}render()}
 else if(a=='thide'){S.hide=!S.hide;save();render()}
 else if(a=='addn'){v=$('#ni').value.trim();if(v){S.notes.push({who:S.cur,text:v});save();render()}}
 else if(a=='deln'){if(confirm('撕掉这张纸条吗？')){S.notes.splice(i,1);ND=-1;save();render()}}
 else if(a=='addw'){v=$('#wi').value.trim();if(v){S.wishes.push({who:S.cur,text:v,done:false});save();render()}}
 else if(a=='tw'){S.wishes[i].done=!S.wishes[i].done;save();render()}
 else if(a=='delw'){S.wishes.splice(i,1);save();render()}
 else if(a=='addd'){v=$('#dn').value.trim();var d=$('#dv').value;if(v&&d){S.days.push({name:v,date:d,yr:$('#dy').checked});save();render()}else toast('名字和日期都要填')}
 else if(a=='deld'){S.days.splice(i,1);save();render()}
 else if(a=='gq'){var p=$('#gpm');p.value+=(p.value?'，':'')+t.dataset.q}
 else if(a=='gset')gset();
 else if(a=='reload')location.reload();
 else if(a=='upd'){toast('正在检查更新…');var P=[];try{if(navigator.serviceWorker)P.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}));if(window.caches)P.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}))}catch(e){}Promise.all(P).then(function(){location.replace(location.pathname+'?u='+Date.now())},function(){location.reload()})}
 else if(a=='gclose')$('#m2').classList.remove('on');
 else if(a=='gtog'){pend.gen=!pend.gen;$('#gb').style.display=pend.gen?'block':'none';$('#gt').classList.toggle('on',!!pend.gen)}
 else if(a=='gretry')runGen(+t.dataset.id);
 else if(a=='gdrop'){var q=gp_(+t.dataset.id);if(q){q.gen=null;save();render()}}
});
render();
try{if('serviceWorker' in navigator){var hadC=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').catch(function(){});navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadC)$('#ub').style.display='block'})}}catch(e){}
</script>
</body>
</html>
